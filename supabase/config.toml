# Edge function settings. All public-facing functions validate input + rate-limit themselves;
# JWT verification is off because guests (anon key) must be able to call them.
[functions.verify-payment]
verify_jwt = false
[functions.create-order]
verify_jwt = false
[functions.download-file]
verify_jwt = false
[functions.submit-form]
verify_jwt = false
[functions.order-status]
verify_jwt = false
[functions.feeds]
verify_jwt = false
# internal — protected by x-internal-secret header
[functions.send-emails]
verify_jwt = false
[functions.refresh-rates]
verify_jwt = false
# Owner-only Vault key checks; verify the caller JWT at the gateway and again in the handler.
[functions.automation-keys]
verify_jwt = true
# Internal pg_cron invocation authenticates with the Vault-backed scheduler secret.
[functions.automation-scheduler]
verify_jwt = false
# GitHub Actions sends a signed OIDC token; the handler verifies its issuer, claims and signature.
[functions.automation-runner]
verify_jwt = false
# Owner-only distribution readbacks and Telegram delivery re-check identity and DB approvals in the handler.
[functions.automation-distribution]
verify_jwt = true

# Owner-only render dispatch for the live video look; the document comes from the database, never the browser.
[functions.automation-video-template]
verify_jwt = true

# Owner-only Web Push config + explicitly confirmed test notification; identity is verified again in the handler.
[functions.automation-push]
verify_jwt = true

# Owner-only Buddy thinking, through the brain chain (Gemini first, then the free brains). The handler re-checks the owner through the Automation keys catalogue.
[functions.buddy-think]
verify_jwt = true

# Owner-only: attempts the owner push for a Takeover or Kill saved in the Minds screen. The handler reads the caller from the JWT.
[functions.minds-control-notify]
verify_jwt = true

[functions.buddy-night-report]
verify_jwt = true
# Internal pg_cron invocation: the night report clock checks x-internal-secret itself, not the owner session.
[functions.buddy-night-clock]
verify_jwt = false
