# Manual recovery path. Regular schedules run inside Supabase via pg_cron + pg_net.
name: Scheduled jobs (manual backup)
on:
  workflow_dispatch:
    inputs:
      job:
        description: Run all scheduled work or one task
        type: choice
        required: true
        default: all
        options:
          - all
          - send-emails
          - refresh-rates
          - keep-alive
permissions:
  contents: read
jobs:
  send-emails:
    if: ${{ inputs.job == 'all' || inputs.job == 'send-emails' }}
    runs-on: ubuntu-latest
    steps:
      - name: Drain email queue
        env:
          URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SECRET: ${{ secrets.INTERNAL_FN_SECRET }}
        run: |
          set -euo pipefail
          URL="${URL%/}"
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 60 \
            -X POST "$URL/send-emails" \
            -H "x-internal-secret: $SECRET" \
            -H "content-type: application/json" \
            -d '{}'
  refresh-rates:
    if: ${{ inputs.job == 'all' || inputs.job == 'refresh-rates' }}
    runs-on: ubuntu-latest
    steps:
      - name: Refresh currency rates
        env:
          URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SECRET: ${{ secrets.INTERNAL_FN_SECRET }}
        run: |
          set -euo pipefail
          URL="${URL%/}"
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 60 \
            -X POST "$URL/refresh-rates" \
            -H "x-internal-secret: $SECRET"
  keep-alive:
    if: ${{ inputs.job == 'all' || inputs.job == 'keep-alive' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping site and sitemap as a manual fallback
        env:
          SITE: ${{ secrets.SITE_URL || 'https://lixxonstudio.vercel.app' }}
        run: |
          set -euo pipefail
          SITE="${SITE%/}"
          curl --fail --silent --show-error --max-time 60 -o /dev/null -w "site %{http_code}\n" "$SITE/"
          curl --fail --silent --show-error --max-time 60 -o /dev/null -w "sitemap %{http_code}\n" "$SITE/sitemap.xml"
