    <script>
      /* Pre-paint theme: the .dark class is the single source of truth. Default is LIGHT
         for everyone (the OS preference is deliberately ignored); dark is only applied
         when the reader explicitly chose it before. Runs before first paint — no flash. */
      (function () {
        try {
          if (localStorage.getItem('lixxon_theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { /* storage blocked — stay light */ }
      })();
    </script>
